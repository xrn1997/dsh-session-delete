<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <!--
    Illustration for the plugin detail page (`docs/DETAIL.md` links it as a Markdown image).

    Both palettes live in the table below: light is the default, dark is a whole-table override
    under `prefers-color-scheme`. The host ThemePresenter writes the resolved theme to
    `documentElement.style.colorScheme`, which is what the media query sees when this file is
    loaded as an `<img>` (same mechanism as `icon.svg`). Never inline a literal color in an
    element here: the illustration would stay a light block in dark mode. Dark values follow the
    host's dark alias palette (bg-base / bg-layer / border / label-primary·secondary·tertiary /
    caption / state-error-primary); panel and strokes are slightly tuned for the illustration.
    Brand and danger stay the same in both modes so accents remain legible.
  -->
  <style>
    text{font-family:'Segoe UI','Helvetica Neue',Arial,'WenQuanYi Zen Hei',sans-serif}
    .page{fill:#F5F6FC}
    .panel{fill:#FFFFFF;stroke:#E6EBF7}
    .rule{stroke:#EDF1F9}
    .row{fill:#FFFFFF}
    .sel{fill:#EEF2FF}
    .bubble{fill:#E8EDFF}
    .chip{fill:#F5F6FC}
    .icon-hit{fill:#F5F6FC}
    .icon{stroke:#7A859E}
    .ink1{fill:#1F2A44}
    .ink2{fill:#38425A}
    .ink3{fill:#7A859E}
    .ink4{fill:#ACB5CF}
    .stroke4{stroke:#ACB5CF}
    .brand{fill:#4D6BFE}
    .danger{fill:#E5484D}
    .on-danger{fill:#FFFFFF}
    @media (prefers-color-scheme: dark){
      .page{fill:#151517}
      .panel{fill:#1E1E20;stroke:#33363B}
      .rule{stroke:#2F3237}
      .row{fill:#1E1E20}
      .sel{fill:#353638}
      .bubble{fill:#2C2C2E}
      .chip{fill:#232325}
      .icon-hit{fill:#26272B}
      .icon{stroke:#ADB2B8}
      .ink1{fill:#F9FAFB}
      .ink2{fill:#CFD3D6}
      .ink3{fill:#ADB2B8}
      .ink4{fill:#81858C}
      .stroke4{stroke:#81858C}
      .danger{fill:#F25A5A}
    }
  </style>
  <rect class="page" width="640" height="300"/>
  <!-- Trash panel -->
  <rect class="panel" x="28" y="22" width="584" height="256" rx="14"/>
  <!-- Header: Trash | Archive -->
  <text class="ink1" x="48" y="50" font-size="13" font-weight="600">Trash 12</text>
  <rect class="brand" x="46" y="57" width="58" height="3" rx="1.5"/>
  <text class="ink4" x="118" y="50" font-size="13">Archive 3</text>
  <line class="rule" x1="44" y1="68" x2="248" y2="68"/>
  <!-- Left: session rows grouped by project -->
  <path class="ink4" d="M47 78h6l2 2h7v8H47z"/>
  <text class="ink3" x="65" y="88" font-size="11">product-site</text>
  <rect class="sel" x="40" y="94" width="210" height="26" rx="8"/>
  <text class="ink1" x="52" y="111" font-size="12">Design review</text>
  <rect class="row" x="40" y="124" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="141" font-size="12">Landing page copy</text>
  <path class="ink4" d="M47 160h6l2 2h7v8H47z"/>
  <text class="ink3" x="65" y="170" font-size="11">cli-tooling</text>
  <rect class="row" x="40" y="176" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="193" font-size="12">Release script triage</text>
  <rect class="row" x="40" y="206" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="223" font-size="12">Copy localization</text>
  <!-- Row actions: restore / delete forever -->
  <g class="icon" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle class="icon-hit" cx="206" cy="107" r="8" stroke="none"/>
    <path d="M210 106h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 107.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="107" r="8" stroke="none"/>
    <path d="M225 105.5h6M226.4 105.5v-.8h3.2v.8M225.8 105.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="137" r="8" stroke="none"/>
    <path d="M210 136h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 137.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="137" r="8" stroke="none"/>
    <path d="M225 135.5h6M226.4 135.5v-.8h3.2v.8M225.8 135.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="189" r="8" stroke="none"/>
    <path d="M210 188h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 189.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="189" r="8" stroke="none"/>
    <path d="M225 187.5h6M226.4 187.5v-.8h3.2v.8M225.8 187.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="219" r="8" stroke="none"/>
    <path d="M210 218h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 219.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="219" r="8" stroke="none"/>
    <path d="M225 217.5h6M226.4 217.5v-.8h3.2v.8M225.8 217.5l.5 4h3.4l.5-4"/>
  </g>
  <!-- Column divider -->
  <line class="rule" x1="262" y1="22" x2="262" y2="278"/>
  <!-- Right: session info and work steps -->
  <text class="ink1" x="284" y="52" font-size="15" font-weight="600">Design review</text>
  <text class="ink3" x="284" y="80" font-size="11">Project</text>
  <text class="ink2" x="352" y="80" font-size="11">product-site</text>
  <text class="ink3" x="284" y="100" font-size="11">Model</text>
  <text class="ink2" x="352" y="100" font-size="11">DeepSeek-V3</text>
  <text class="ink3" x="284" y="120" font-size="11">Created</text>
  <text class="ink2" x="352" y="120" font-size="11">Nov 8, 14:02</text>
  <text class="ink3" x="284" y="140" font-size="11">Trash dir</text>
  <text class="ink2" x="352" y="140" font-size="11">~/.dsh/session-trash</text>
  <!-- Work steps bar -->
  <rect class="chip" x="284" y="154" width="306" height="26" rx="6"/>
  <text class="ink2" x="298" y="171" font-size="11">Work steps · 3</text>
  <path class="stroke4" d="M568 164l4 4 4-4" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Conversation preview -->
  <rect class="bubble" x="284" y="192" width="200" height="22" rx="7"/>
  <text class="ink2" x="296" y="207" font-size="10.5">Fix the release script</text>
  <rect class="chip" x="284" y="222" width="306" height="20" rx="7"/>
  <text class="ink3" x="296" y="236" font-size="10">Updated three settings, added rollback notes…</text>
  <!-- Footer: the page's only solid red button -->
  <rect class="danger" x="486" y="244" width="104" height="28" rx="8"/>
  <text class="on-danger" x="538" y="262" font-size="11" text-anchor="middle">Empty trash…</text>
</svg>