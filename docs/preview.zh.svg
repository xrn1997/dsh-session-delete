<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <!--
    插件详情页的示意插图（`docs/DETAIL.zh.md` 以 Markdown 图片引用）。

    两档配色都住下面这张表：浅色档是默认值，深色档由 `prefers-color-scheme` 整组覆盖。
    宿主 ThemePresenter 会把解析后的主题写到 `documentElement.style.colorScheme`，本图作为
    `<img>` 载入时媒体查询按它求值（机制与 `icon.svg` 同源）——不能在元素上写死颜色，否则
    深色模式下整张图仍是一块浅色画布。深色档按宿主深色 alias 的色值取向（bg-base / bg-layer /
    border / label-primary·secondary·tertiary / caption / state-error-primary），面板与描边为
    示意图略作收敛；brand 与危险红两档同色，保持强调可辨。
  -->
  <style>
    text{font-family:'WenQuanYi Zen Hei','PingFang SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif}
    .page{fill:#F5F6FC}
    .panel{fill:#FFFFFF;stroke:#E6EBF7}
    .rule{stroke:#EDF1F9}
    .row{fill:#FFFFFF}
    .sel{fill:#EEF2FF}
    .bubble{fill:#E8EDFF}
    .chip{fill:#F5F6FC}
    .icon-hit{fill:#F5F6FC}
    .icon{stroke:#7A859E}
    .ink1{fill:#1F2A44}
    .ink2{fill:#38425A}
    .ink3{fill:#7A859E}
    .ink4{fill:#ACB5CF}
    .stroke4{stroke:#ACB5CF}
    .brand{fill:#4D6BFE}
    .danger{fill:#E5484D}
    .on-danger{fill:#FFFFFF}
    @media (prefers-color-scheme: dark){
      .page{fill:#151517}
      .panel{fill:#1E1E20;stroke:#33363B}
      .rule{stroke:#2F3237}
      .row{fill:#1E1E20}
      .sel{fill:#353638}
      .bubble{fill:#2C2C2E}
      .chip{fill:#232325}
      .icon-hit{fill:#26272B}
      .icon{stroke:#ADB2B8}
      .ink1{fill:#F9FAFB}
      .ink2{fill:#CFD3D6}
      .ink3{fill:#ADB2B8}
      .ink4{fill:#81858C}
      .stroke4{stroke:#81858C}
      .danger{fill:#F25A5A}
    }
  </style>
  <rect class="page" width="640" height="300"/>
  <!-- 回收站面板 -->
  <rect class="panel" x="28" y="22" width="584" height="256" rx="14"/>
  <!-- 头部：回收站 | 归档 平级分段 -->
  <text class="ink1" x="48" y="50" font-size="13" font-weight="600">回收站 12</text>
  <rect class="brand" x="46" y="57" width="68" height="3" rx="1.5"/>
  <text class="ink4" x="128" y="50" font-size="13">归档 3</text>
  <line class="rule" x1="44" y1="68" x2="248" y2="68"/>
  <!-- 左列：按项目分组的会话行 -->
  <path class="ink4" d="M47 78h6l2 2h7v8H47z"/>
  <text class="ink3" x="65" y="88" font-size="11">产品官网</text>
  <rect class="sel" x="40" y="94" width="210" height="26" rx="8"/>
  <text class="ink1" x="52" y="111" font-size="12">与设计的评审会</text>
  <rect class="row" x="40" y="124" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="141" font-size="12">重构落地页文案</text>
  <path class="ink4" d="M47 160h6l2 2h7v8H47z"/>
  <text class="ink3" x="65" y="170" font-size="11">CLI 工具</text>
  <rect class="row" x="40" y="176" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="193" font-size="12">发布脚本排查</text>
  <rect class="row" x="40" y="206" width="210" height="26" rx="8"/>
  <text class="ink2" x="52" y="223" font-size="12">文案本地化</text>
  <!-- 行右：恢复 / 彻底删除图标按钮 -->
  <g class="icon" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle class="icon-hit" cx="206" cy="107" r="8" stroke="none"/>
    <path d="M210 106h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 107.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="107" r="8" stroke="none"/>
    <path d="M225 105.5h6M226.4 105.5v-.8h3.2v.8M225.8 105.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="137" r="8" stroke="none"/>
    <path d="M210 136h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 137.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="137" r="8" stroke="none"/>
    <path d="M225 135.5h6M226.4 135.5v-.8h3.2v.8M225.8 135.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="189" r="8" stroke="none"/>
    <path d="M210 188h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 189.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="189" r="8" stroke="none"/>
    <path d="M225 187.5h6M226.4 187.5v-.8h3.2v.8M225.8 187.5l.5 4h3.4l.5-4"/>
    <circle class="icon-hit" cx="206" cy="219" r="8" stroke="none"/>
    <path d="M210 218h-5.6q-2.6 0-2.6 2.8"/>
    <path d="M200.2 219.2l1.6 1.8 1.6-1.8"/>
    <circle class="icon-hit" cx="228" cy="219" r="8" stroke="none"/>
    <path d="M225 217.5h6M226.4 217.5v-.8h3.2v.8M225.8 217.5l.5 4h3.4l.5-4"/>
  </g>
  <!-- 分栏线 -->
  <line class="rule" x1="262" y1="22" x2="262" y2="278"/>
  <!-- 右栏：会话信息与工作步骤 -->
  <text class="ink1" x="284" y="52" font-size="15" font-weight="600">与设计的评审会</text>
  <text class="ink3" x="284" y="80" font-size="11">项目</text>
  <text class="ink2" x="352" y="80" font-size="11">产品官网</text>
  <text class="ink3" x="284" y="100" font-size="11">模型</text>
  <text class="ink2" x="352" y="100" font-size="11">DeepSeek-V3</text>
  <text class="ink3" x="284" y="120" font-size="11">创建</text>
  <text class="ink2" x="352" y="120" font-size="11">11-08 14:02</text>
  <text class="ink3" x="284" y="140" font-size="11">回收站目录</text>
  <text class="ink2" x="352" y="140" font-size="11">~/.dsh/session-trash</text>
  <!-- 工作步骤折叠条 -->
  <rect class="chip" x="284" y="154" width="306" height="26" rx="6"/>
  <text class="ink2" x="298" y="171" font-size="11">工作步骤 · 3 步</text>
  <path class="stroke4" d="M568 164l4 4 4-4" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 对话预览 -->
  <rect class="bubble" x="284" y="192" width="200" height="22" rx="7"/>
  <text class="ink2" x="296" y="207" font-size="10.5">帮我改一下发布脚本</text>
  <rect class="chip" x="284" y="222" width="306" height="20" rx="7"/>
  <text class="ink3" x="296" y="236" font-size="10">已更新三处配置，并补了回滚说明…</text>
  <!-- 页脚：整页唯一的实心红按钮 -->
  <rect class="danger" x="486" y="244" width="104" height="28" rx="8"/>
  <text class="on-danger" x="538" y="262" font-size="11" text-anchor="middle">清空回收站…</text>
</svg>