  （与插件界面里那枚垃圾桶图标同源）。

  两处与组件版不同：
  1. 颜色写死。图片形式的 SVG **不继承 `currentColor`**（它是一份独立文档），所以不能像组件里那样
     吃宿主的字色 ⇒ 取一个浅色/深色底上都能读的中灰。
  2. 不带 `aria-hidden`。这不是行内构件，可及名由承载它的宿主卡片提供。
-->
