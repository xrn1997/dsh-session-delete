name: Release

# 发版资产：`V*` tag push 时把 `pnpm pack` 的 tarball 挂到 GitHub Release，给不想构建的
# 用户一条免构建的安装路径（`lib/` 仍不入库，仓库 URL 的 github:/git: 直装依旧不支持）。
# 决策与被否方案见 `ADR-0025`；安装 URL 与发版步骤住 `README.md`「安装」与
# `docs/development.md`「发版流程」。

on:
  push:
    tags: ['V*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 与 ci.yml 相同：pnpm 版本住 packageManager，Node 版本两处各写一次。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # 先验 tag 再装依赖与跑门：版本对不上时立刻红，不必烧安装与整套门。
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const v=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'V'+v) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match package version V' + v); process.exit(1) }"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 ci.yml 跑同一组门：调同一个 `gates`，不在这里另抄步骤清单（tag 不保证落在 main 上，
      # 产物必须自证；两套清单必然漂移，而漂移的结果是发版门比检查门更宽）。
      - name: Gates
        run: pnpm gates

      - name: Pack tarball
        run: |
          # `pnpm pack` 会再跑一次 `prepack`（build）；保留这条生命周期，让 tarball 自己证明它能被产出。
          mkdir -p dist
          pnpm pack --pack-destination dist
          expected=$(node -p "const p = require('./package.json'); p.name.replace('@', '').replace('/', '-') + '-' + p.version + '.tgz'")
          # 钉版本 URL 写的就是这个文件名（README「安装」）；scoped 包名到文件名的改名规则变了这里先红。
          test -f "dist/$expected" || { echo "dist/ has no $expected"; exit 1; }
          # 稳定别名给 releases/latest/download 用；README 只记钉版本 URL，别名 URL 不在 README 列出。
          cp "dist/$expected" dist/dsh-session-delete.tgz
          echo "TGZ=dist/$expected" >> "$GITHUB_ENV"

      - name: Verify tarball contents
        run: |
          # 期望树与对账算法只有一份（scripts/verify-pack.mjs）：发版与 gates 用同一条判据。
          node scripts/verify-pack.mjs --tarball "$TGZ"

      # Release 正文：从 `CHANGELOG.md` 该版条目与 `package.json` 事实投影（规则住
      # `scripts/release-notes.mjs`），不用 `--generate-notes` 的 commit 列表——用户要读的是
      # 「这一版能干什么、怎么装、升级注意什么」。放在 Gates 之后生成：正文「发布验证」一节
      # 说的就是本工作流实跑通过的那些门，没跑过不许写。
      - name: Generate release notes
        run: node scripts/release-notes.mjs dist/release-notes.md

      # 同一份 artifact 三个用途：dry run 的产物与正文预览；tag 运行时给 publish job 交接。
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-session-delete-tarball
          path: |
            dist/*.tgz
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: build
    # dispatch 即使在 tag ref 上也只是干跑；只有 push tag 才发布。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # 正文用 build job 交接的 notes 文件（从 CHANGELOG 投影，compare 链接也在里面），不再
      # `--generate-notes`；`--verify-tag` 确认 tag 已存在，防 GitHub 隐式建出指向别的提交的 tag。
      # fetch-depth: 0 留完整历史，失败排查时好用。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download tarball artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-session-delete-tarball
          path: dist

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tgz --clobber
            if [ "${#prerelease[@]}" -gt 0 ]; then gh release edit "$tag" --prerelease; fi
          else
            gh release create "$tag" dist/*.tgz --verify-tag --title "$tag" --notes-file dist/release-notes.md "${prerelease[@]}"
          fi
