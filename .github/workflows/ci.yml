name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本住 package.json 的 packageManager；Node 版本在本文件与 release.yml 各写一次，升级时一起改。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 门禁总入口是 package.json 的 `gates`：本地与 CI 跑同一条，不在工作流里另写步骤清单。
      # 需要真浏览器/真宿主的门刻意不进 CI，见 docs/development.md。
      - run: pnpm gates
