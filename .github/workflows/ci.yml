name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # 两条腿互不连坐：Windows 红不该让 Ubuntu 的结论也消失（诊断要能分开看）。
      fail-fast: false
      matrix:
        # 主开发平台是 Windows（docs 的 PowerShell 口径），只在 Linux 上跑等于放过一类
        # 路径分隔符回归：2026-11-14 文档锚点门就因此在 Windows 上红、在 CI 上绿过。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本住 package.json 的 packageManager；Node 版本在本文件与 release.yml 各写一次，升级时一起改。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # 门禁总入口是 package.json 的 `gates`：本地与 CI 跑同一条，不在工作流里另写步骤清单。
      # 需要真浏览器/真宿主的门刻意不进 CI，见 docs/development.md。
      - run: pnpm gates
